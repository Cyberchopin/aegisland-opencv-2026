<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AegisLand: measured local loop and separately verified cloud boundary</title><desc id="desc">OpenCV measurements feed a deterministic planner, a rescan loop and simulated commands with human-review states. Local immutable evidence is delivered after simulation. The first AWS deployment passed, storage returned503 and teardown passed; the corrected path later passed 34/34 requests, nine-file readback and cleanup.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#47617b"/></marker></defs>
<rect width="1200" height="760" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="50" y="48" font-size="30" font-weight="bold">AegisLand — evidence drives the next simulated action</text>
<text x="50" y="80" font-size="18">Pinned OpenCV 5 CPU path · deterministic policy · no aircraft commands</text>
<g fill="#e1efff" stroke="#517ca8" stroke-width="2"><rect x="50" y="130" width="255" height="150" rx="14"/><rect x="405" y="130" width="350" height="150" rx="14"/><rect x="855" y="130" width="295" height="150" rx="14"/></g>
<g font-size="19"><text x="70" y="164" font-weight="bold">Scripted observation</text><text x="70" y="198">Video + telemetry</text><text x="70" y="230">GPS / light / motion faults</text><text x="425" y="164" font-weight="bold">OpenCV perception</text><text x="425" y="198">Edges, flow, compensation, zones</text><text x="425" y="230">Risk and confidence heuristics</text><text x="875" y="164" font-weight="bold">Planner and human gate</text><text x="875" y="198">Inspect / rescan / revise intent</text><text x="875" y="230">Simulation adapter only</text></g>
<g stroke="#47617b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M305 205H405"/><path d="M755 205H855"/><path d="M1000 280V335H580V280"/><path d="M580 335V385"/></g>
<text x="650" y="322" font-size="17">Low-confidence retry: CLAHE + re-observe</text>
<rect x="320" y="390" width="620" height="105" rx="14" fill="#dcf3e4" stroke="#477f5a" stroke-width="2"/><text x="345" y="427" font-size="21" font-weight="bold">Immutable local evidence</text><text x="345" y="460" font-size="18">Annotated MP4 · decisions · dashboard · hashes · provenance</text>
<path d="M630 495V540" stroke="#47617b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>
<rect x="130" y="550" width="940" height="150" rx="14" fill="#fff0db" stroke="#ad7630" stroke-width="2"/><text x="155" y="586" font-size="21" font-weight="bold">Separate post-run AWS evidence path</text><text x="155" y="619" font-size="18">IAM API → Lambda → conditional S3 bytes + DynamoDB index</text><text x="155" y="651" font-size="18">Current run: 34/34 requests PASS · 9/9 files match · cleaned</text><text x="155" y="680" font-size="18">First run: storage503FAIL preserved · recorded evidence, not a live endpoint</text>
<text x="50" y="738" font-size="16">Three fixed synthetic runs / 230 events. Not flight certification, GPU acceleration, or a field-success claim.</text></g></svg>