AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Competition evidence v1 - independent of the unchanged core safety loop
Resources:
  EvidenceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Auth:
        EnableIamAuthorizer: true
        DefaultAuthorizer: AWS_IAM
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-evidence
            Status: Enabled
            ExpirationInDays: 30
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${EvidenceBucket.Arn}/evidence/*'
            Condition:
              'Null':
                s3:if-none-match: 'true'
  TraceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TraceId
          AttributeType: S
        - AttributeName: Sequence
          AttributeType: N
      KeySchema:
        - AttributeName: TraceId
          KeyType: HASH
        - AttributeName: Sequence
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  EvidenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: evidence-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${EvidenceBucket.Arn}/evidence/*'
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem]
                Resource: !GetAtt TraceTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-evidence:*'
  EvidenceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-evidence'
      RetentionInDays: 14
  EvidenceFunction:
    Type: AWS::Serverless::Function
    DependsOn: EvidenceLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-evidence'
      CodeUri: ../cloud/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: 2
      Role: !GetAtt EvidenceRole.Arn
      Environment:
        Variables:
          TRACE_TABLE: !Ref TraceTable
          EVIDENCE_BUCKET: !Ref EvidenceBucket
      Events:
        Evidence:
          Type: HttpApi
          Properties:
            ApiId: !Ref EvidenceApi
            Path: /evidence
            Method: POST
Outputs:
  EvidenceEndpoint:
    Value: !Sub 'https://${EvidenceApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1'
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  TraceTableName:
    Value: !Ref TraceTable
